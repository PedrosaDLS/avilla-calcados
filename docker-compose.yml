services:
  postgres:
    image: postgres:16-alpine
    container_name: avilla-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: avilla
      POSTGRES_PASSWORD: avilla
      POSTGRES_DB: avilla
    volumes:
      - avilla_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avilla -d avilla"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  avilla_pg_data:
